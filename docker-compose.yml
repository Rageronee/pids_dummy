services:
  db:
    image: postgres:15-alpine
    container_name: pids-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_DB: eltran_pids
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "5432:5432"
    volumes:
      - pids_db_data:/var/lib/postgresql/data
      - ./pg_hba_custom.conf:/etc/postgresql-custom/pg_hba.conf
    command: ["-c", "hba_file=/etc/postgresql-custom/pg_hba.conf", "-c", "password_encryption=md5"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    container_name: pids-adminer
    restart: always
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy

  # Placeholder for future Device/Sensor Service (e.g. GPSD)
  # gpsd:
  #   image: ghcr.io/mikenye/docker-gpsd
  #   container_name: pids-gpsd
  #   devices:
  #     - "/dev/ttyUSB0:/dev/ttyUSB0"
  #   ports:
  #     - "2947:2947"
  #   restart: always

volumes:
  pids_db_data:


services:
  # Database (Unified)
  db:
    image: postgres:15-alpine
    container_name: pids-db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=eltran123
      - POSTGRES_DB=eltran_pids
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Redis for state/cache
  redis:
    image: redis:alpine
    container_name: pids-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Database Management (Added from root)
  adminer:
    image: adminer
    container_name: pids-adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  # Backend API
  api:
    build:
      context: .
      target: backend
    container_name: pids-api
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:eltran123@db:5432/eltran_pids
      - REDIS_URL=redis://redis:6379
      - API_PORT=3001
      - NODE_ENV=production
    ports:
      - "3001:3001"
    volumes:
      - ./runtime:/app/runtime
      - ./packages/master-app/public/geojson:/app/public/geojson

  # Frontend Web
  web:
    build:
      context: .
      target: frontend
    container_name: pids-web
    restart: always
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  db-data:
